profile=gpu-hq

gpu-context=auto

fullscreen=yes

keep-open=yes

save-position-on-quit=yes

force-seekable=yes

#Cursor hide in ms
cursor-autohide=100

alang=kr,ko,zh,ja,jp,jpn,en,eng
slang=en,eng,English,en-US,US

vo=gpu-next
 
gpu-api=nvdec #because i have nvidia
vd-lavc-dr=yes
hwdec=nvdec
hwdec-codecs=all

#Ignore cropping (if specified inside a .mkv file)
video-crop=0x0+0+0

#Forces showing subtitles while seeking through the video
demuxer-mkv-subtitle-preroll=yes

sub-fix-timing=yes
sub-scale=0.7
sub-margin-y=60
sub-gauss=1.0
sub-color='#ccd4e1'
dither-depth=auto

#Selects the dithering algorithm
#Use "fruit" (8-Bit/8-Bit+FRC display), "ordered" (true 10-Bit/12-Bit display) or "error-diffusion" with high-end GPUs
dither=error-dffusion
temporal-dither=yes

#Selects the kernel in case of error-diffusion
#"sierra-lite" is the fastest decent choice, reasonable alternatives are "floyd-steinberg" or "atkinson" 
error-diffusion=atkinson

interpolation=no
tscale=oversample
interpolation-preserve
display-fps-override=144 #Specify if hz is above 60)
video-sync=display-resample #(Enable for high hz display)
tscale-blur=0.6991556596428412
deband=no

###### Shaders ######

###### Luma up
glsl-shader="~/.config/mpv/shaders/nnedi3-nns256-win8x4.hook"

#ewa_lanczossharp
scale=ewa_lanczos
scale-blur=0.981251

###### Luma down
glsl-shader="~/.config/mpv/shaders/SSimDownscaler.glsl"
dscale=hermite
linear-downscaling=no
correct-downscaling=yes

###### Chroma up + down
glsl-shader="~/.config/mpv/shaders/KrigBilateral.glsl"
cscale=mitchell

###### Antiring
scale-antiring=0.7
dscale-antiring=0.7
cscale-antiring=0.7

# Grain Shaders
#Luma
glsl-shader="~/.config/mpv/shaders/noise_static_luma.hook"

#Chroma
glsl-shader="~/.config/mpv/shaders/noise_static_chroma.hook"

screenshot-directory="~/Pictures/Screenshots/"
screenshot-high-bit-depth=yes

###osd
no-border
osd-bar=no
osd-bold=yes
osd-font-size=37
osd-font='JetBrains Mono'
